
spring.application.name=rest1

spring.datasource.url=jdbc:postgresql://localhost:5432/budget
spring.datasource.username=${DB_USERNAME:budget_bb}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
jwt.secret=${JWT_SECRET}
jwt.access-expiration=900
jwt.refresh-expiration=604800
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:${user.home}/lab6-certificates/budget-server.p12
server.ssl.key-store-password=${SSL_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=budget-server
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3